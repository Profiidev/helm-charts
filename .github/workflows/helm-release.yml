name: Helm Continuous Deployment

on:
  push:
    branches:
      - main

env:
  HAS_COMMIT_BOT_KEY: ${{ secrets.COMMIT_BOT_PRIVATE_KEY != '' }}

jobs:
  release:
    name: Release Helm Charts
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: profiidev/gluon@d715c4a8bd804db764307ad041e73c1c60ec7382 # v0
        id: gluon
        if: env.HAS_COMMIT_BOT_KEY != 'true'
        with:
          url: https://gluon.profidev.io
      # Fallback while the broker is down: re-add the COMMIT_BOT_PRIVATE_KEY secret.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        id: app-token
        if: env.HAS_COMMIT_BOT_KEY == 'true'
        with:
          client-id: Iv23liM4eWCXa0R0IMG9
          private-key: ${{ secrets.COMMIT_BOT_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config user.name "profidev-commit-bot[bot]"
          git config user.email "profidev-commit-bot[bot]@users.noreply.github.com"
      - name: Run chart-releaser job
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1
        env:
          CR_TOKEN: "${{ steps.gluon.outputs.token || steps.app-token.outputs.token }}"
