---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.secret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secret.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Chart.Name }}
    # hydra.conf can carry OIDC client ids and is therefore rendered here
    # rather than in the ConfigMap. Merge keeps the extracted keys, which the
    # container reads as environment variables.
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        hydra.conf: |
          using_frontend_proxy = {{ if .Values.hydra.usingFrontendProxy }}1{{ else }}0{{ end }}
          base_uri = {{ .Values.hydra.baseUri }}
          notification_sender = {{ .Values.hydra.notificationSender }}
          max_servers = {{ .Values.hydra.maxServers }}
          max_output_size = {{ .Values.hydra.maxOutputSize | int64 }}
          {{- with .Values.hydra.queueRunnerEndpoint }}
          queue_runner_endpoint = {{ . }}
          {{- end }}
          {{- if .Values.hydra.oidc.enabled }}
          <oidc>
          {{- range $name, $provider := .Values.hydra.oidc.providers }}
            <provider {{ $name }}>
              display_name = "{{ $provider.displayName | default $name }}"
              discovery_url = "{{ $provider.discoveryUrl }}"
              {{- if $provider.clientIdKey }}
              client_id = "{{ printf "{{ .%s }}" $provider.clientIdKey }}"
              {{- else }}
              client_id = "{{ $provider.clientId }}"
              {{- end }}
              client_secret_file = "/etc/hydra/oidc/{{ $name }}"
              {{- with $provider.extraScopes }}
              extra_scopes = "{{ . }}"
              {{- end }}
              {{- with $provider.rolesClaim }}
              roles_claim = {{ . }}
              {{- end }}
              {{- with $provider.roleMapping }}
              <role_mapping>
                {{- range $group, $roles := . }}
                {{- range $role := $roles }}
                {{ $group }} = {{ $role }}
                {{- end }}
                {{- end }}
              </role_mapping>
              {{- end }}
            </provider>
          {{- end }}
          </oidc>
          {{- end }}
          {{- with .Values.hydra.extraConfig }}
          {{ . | nindent 10 }}
          {{- end }}
  dataFrom:
    - extract:
        key: {{ .Values.secret.path }}
