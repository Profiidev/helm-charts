---
{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.tls }}
{{- fail "ingress.tls is required: OIDC bearer tokens must not travel over plain HTTP" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    name: {{ .Chart.Name }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "traefik" }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Only the token API is public; health and metrics stay internal.
          - pathType: Prefix
            path: /api/v1/
            backend:
              service:
                name: {{ .Chart.Name }}
                port:
                  number: 8000
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
