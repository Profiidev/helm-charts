---
{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.tls }}
{{- fail "ingress.tls is required: OIDC bearer tokens must not travel over plain HTTP" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    name: {{ .Chart.Name }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | default "traefik" }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          # Only the two token endpoints are public; nothing else (health,
          # metrics, unknown paths) is reachable from outside.
          {{- range list "/api/v1/token" "/api/v1/exchange" }}
          - pathType: Exact
            path: {{ . }}
            backend:
              service:
                name: {{ $.Chart.Name }}
                port:
                  number: 8000
          {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
