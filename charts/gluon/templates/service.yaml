---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Chart.Name }}
spec:
  ports:
    - port: 8000
      protocol: TCP
      targetPort: 8000
      name: http
    - port: 9090
      protocol: TCP
      targetPort: 9090
      name: metrics
  selector:
    app: {{ .Chart.Name }}
  type: ClusterIP
